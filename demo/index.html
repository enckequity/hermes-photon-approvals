<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamShift live button test</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; padding: 16px; }
    h1 { font-size: 19px; margin: 0 0 10px; }
    p { line-height: 1.4; }
    .buttons { display: flex; gap: 10px; }
    button { min-height: 48px; flex: 1; border: 1px solid #888; border-radius: 12px; font: inherit; padding: 10px; }
    #approve { background: #146d43; color: white; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <h1>TeamShift live button test</h1>
  <p>Tap one choice. This demo cannot approve a command.</p>
  <div class="buttons">
    <button id="approve" type="button">Approve demo</button>
    <button id="deny" type="button">Deny demo</button>
  </div>
  <p id="status" role="status" aria-live="polite">Waiting for a tap.</p>
  <p>If you opened a panel to see these buttons, the inline test has not passed.</p>
  <script src="/demo.js"></script>
</body>
</html>
