<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TeamShift approval preview</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #192a40; background: transparent; --surface: #fff; --line: #e1e7ee; --muted: #627287; --inset: #f4f7fb; --blue: #2158cd; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; }
    .card { max-width: 400px; margin: 0 auto; padding: 18px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: 0 3px 14px #132b4610; }
    header { display: flex; align-items: center; gap: 8px; }
    .mark { width: 24px; height: 24px; color: var(--blue); flex: none; }
    .brand { font-size: 13px; font-weight: 720; letter-spacing: -.3px; }
    .badge { margin-left: auto; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; }
    h1 { margin: 18px 0 5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; line-height: 1.15; font-weight: 720; letter-spacing: -.65px; }
    .description { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
    .request { display: flex; align-items: center; gap: 10px; margin: 16px 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--inset); }
    .request svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
    .request p { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.4; }
    .request small { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: var(--muted); }
    .buttons { display: grid; grid-template-columns: 1fr 1.65fr; gap: 8px; }
    button { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button svg { width: 16px; height: 16px; }
    #approve { background: var(--blue); color: white; border-color: var(--blue); }
    button:focus-visible { outline: 3px solid #88afff; outline-offset: 3px; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: default; }
    #status { margin: 12px 0 0; min-height: 15px; color: var(--muted); font-size: 11px; line-height: 1.45; text-align: center; }
    #status[data-choice="approve"] { color: #13734e; }
    #status[data-choice="deny"] { color: #9a463c; }
    @media (max-width: 300px) { body { padding: 6px; } .card { padding: 14px; border-radius: 18px; } h1 { font-size: 20px; } }
    @media (prefers-color-scheme: dark) { :root { color: #e9eef7; --surface: #172233; --line: #304055; --muted: #a1b1c7; --inset: #1d2b40; --blue: #477bed; } .card { box-shadow: none; } #status[data-choice="approve"] { color: #7bd9af; } #status[data-choice="deny"] { color: #f3a99f; } }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <header>
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h10v7H4zM10 13h10v7H10z" fill="currentColor"/><path d="M17 4h3v7h-3zM4 13h3v7H4z" fill="currentColor" opacity=".35"/></svg>
      <span class="brand">TeamShift</span><span class="badge">Demo</span>
    </header>
    <h1 id="title">Your call.</h1>
    <p class="description">Try an approval, right here in Messages.</p>
    <div class="request">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
      <p>Review a sample request<small>No files, messages or settings will change.</small></p>
    </div>
    <div class="buttons">
      <button id="deny" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg>Deny</button>
      <button id="approve" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>Approve demo</button>
    </div>
    <p id="status" role="status" aria-live="polite">Demo only. Nothing will run.</p>
  </main>
  <script src="/demo.js"></script>
</body>
</html>
