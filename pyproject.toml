[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-photon-approvals"
version = "0.1.0"
description = "Request-bound Photon approval cards for unchanged Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TeamShift"}]
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3"]

[project.urls]
Repository = "https://github.com/enckequity/hermes-photon-approvals"

[tool.setuptools.packages.find]
include = ["hermes_photon_approvals*"]
